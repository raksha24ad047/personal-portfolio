<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Get in touch with Raksha Shetty through the accessible contact form on her personal portfolio.">

    <meta name="author" content="Raksha Shetty">

    <title>Contact | Raksha Shetty</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Contact Me</h1>
        <p>I'd be happy to hear from you.</p>
    </header>

    <nav aria-label="Main navigation">
        <ul>
            <li>
                <a href="index.html">Home</a>
            </li>

            <li>
                <a href="about.html">About</a>
            </li>

            <li>
                <a href="projects.html">Projects</a>
            </li>

            <li>
                <a href="contact.html" aria-current="page">Contact</a>
            </li>
        </ul>
        <button
    type="button"
    id="theme-toggle"
    aria-label="Switch to dark mode">
    🌙 Dark Mode
</button>
    </nav>

    <main>

        <section aria-labelledby="contact-heading">
            <h2 id="contact-heading">Get in Touch</h2>

            <p>
                If you would like to get in touch, you can use
                the form below.
            </p>

            <form action="#" method="post">

                <div>
                    <label for="name">Full Name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        autocomplete="name"
                        required>
                </div>

                <div>
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required>
                </div>

                <div>
                    <label for="subject">Subject</label>

                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        required>
                </div>

                <div>
                    <label for="message">Message</label>

                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        required></textarea>
                </div>

                <button type="submit">
                    Send Message
                </button>

            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Raksha Shetty. All rights reserved.</p>
    </footer>
<script src="script.js"></script>
</body>

</html>
